<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--paper:#f7f8f4;--ink:#202c33;--muted:#52616a;--line:#cbd2cd;--accent:#145f58;--focus:#b25916}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.75 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1120px;margin:auto;padding:42px 28px 80px}header{border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:36px;line-height:1.3;margin:0 0 12px}h2{font-size:26px;line-height:1.4}h3{font-size:20px}h4{font-size:17px}p{max-width:82ch}a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}button,input,select{font:inherit}button{padding:6px 14px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:var(--accent);color:#fff}input,select{border:1px solid var(--line);border-radius:4px;padding:6px 10px;max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}nav{display:flex;gap:10px 18px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line)}section{padding:16px 0;scroll-margin-top:18px}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}pre{overflow:auto;background:#edf0e9;padding:16px}table{border-collapse:collapse;display:block;overflow:auto}th,td{padding:10px;border:1px solid var(--line);text-align:left}.snapshot,.muted,.source,.map-hint{color:var(--muted);font-size:15px}.note,.node-detail{background:#eef2ec;border-left:3px solid var(--accent);padding:12px 18px}.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}.buttons,.map-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panel[hidden]{display:none}.panel{margin-top:16px}.map{margin:24px 0 36px}.map figcaption{font-size:21px;font-weight:650}.map{border-top:1px solid var(--line);padding-top:18px}.map-controls{background:#edf1eb;padding:12px;border-radius:6px}.map-controls label{font-size:14px}.map-hint{font-size:14px}.map-scroll{background:#fbfcf9;border:1px solid #dce2d8;border-radius:10px;margin:10px 0;padding:12px}.map-scroll{overflow-x:auto;padding:12px 0}.map svg{display:block;width:100%;min-width:690px}.map-group rect{fill:#f0f3ed;stroke:#c8d2c5;stroke-width:1}.map-group text{font-size:14px;font-weight:600;fill:#52616a}.edge{fill:none;stroke:#577569;stroke-width:1.8}.edge.conditional,.edge.optional,.edge.feedback{stroke-dasharray:7 5;stroke:#859388}.edge.reference{stroke:#78909b;stroke-dasharray:2 4}.edge.uncertain{stroke-dasharray:3 5}.edge-label rect{fill:#fbfcf9;stroke:#dce2d8;stroke-width:.5}.edge-label text{font-size:14px;fill:#46574e}.node rect{fill:#fff;stroke:#aebeb1;stroke-width:1.25}.node.core rect{fill:#e3f0ea;stroke:#326f5f;stroke-width:1.8}.node.data rect{fill:#edf2f6;stroke:#829cae}.node.optional rect{stroke-dasharray:5 3;fill:#f9faf7}.node.actor rect,.node.result rect{fill:#f2f4ed}.node text{fill:var(--ink)}.node .node-role{font-size:14px;fill:#617065}.node .node-title{font-size:16px;font-weight:650}.node .node-summary{font-size:14px;fill:#52616a}.node .basis{font-size:12px;fill:#617065}.node{cursor:pointer}.node.selected rect,.node:focus-visible rect{stroke:var(--focus);stroke-width:3}.node:focus-visible{outline:none}.edge.reached{stroke:var(--accent);stroke-width:3}.dim{opacity:.24}.node-detail h3{margin:0 0 8px}.node-detail p{margin:6px 0}.node-detail ul{margin:6px 0}.node-detail code{font-size:13px;overflow-wrap:anywhere}.architecture-map{margin:22px 0;overflow-x:auto}.architecture-map svg{width:100%;min-width:650px}.architecture-map text{font:16px system-ui}.arch-node rect,.arch-mode rect{fill:#fff;stroke:var(--line)}.arch-heading,.arch-package-title{font-weight:650}.arch-small{font-size:13px!important}.arch-guidance{stroke-dasharray:6 5}.diagram-key{font-size:14px;color:var(--muted)}footer{margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
.map-body{display:block}.detail-pane{align-self:start}.detail-pane>button{margin-top:10px}.map-status{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--paper);padding:8px 0;border-bottom:1px solid var(--line)}.map-status p{margin:0;max-height:4.5em;overflow:auto}.map-status button{flex-shrink:0}button:disabled{cursor:default;opacity:.55}.node-detail{scroll-margin-top:90px}.source-identity code{display:block}.task-entry{display:flex;flex-wrap:wrap;gap:12px 24px;margin:20px 0}.node{scroll-margin-block:100px}.map-scroll{min-width:0}.map details,.node-detail,.map-status p{overflow-wrap:anywhere}.map-controls label{min-width:0;max-width:100%}
.map-controls select{width:24ch;max-width:100%}
.node-detail{line-height:1.6;min-width:0}
.node-detail h3{font-size:18px;line-height:1.4}
.node-detail h4{font-size:15px;margin:16px 0 4px}
.node-detail p{max-width:42em;white-space:pre-line}
.node-detail details{padding:6px 0}
.node-detail .node-relations{list-style:none;padding:0}
.node-relations li{border-top:1px solid var(--line);padding:8px 0}
.node-relations strong{margin-right:8px}
.node-relations p{margin:2px 0}
@media(min-width:1600px){.map{width:1440px;margin-left:calc((100% - 1440px)/2)}.map-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.detail-pane{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;padding:4px}.map-scroll{margin-top:0}.node-detail{padding:12px}.node-detail li{font-size:15px}.node-detail ul{padding-left:20px}}
@media print{.map-status{position:static}.map-body{display:block}.detail-pane{position:static;max-height:none;overflow:visible}.map{width:auto;margin-left:0}}
@media(max-width:700px){main{padding:24px 16px 60px}.pairs{grid-template-columns:1fr}h1{font-size:30px}}@media print{button,input{display:none}main{padding:0;max-width:none}.dim{opacity:1}.node-detail{break-inside:avoid}a{color:inherit}}
</style></head>
<body><main><header><h1>{{TITLE}}</h1><p class="snapshot">{{SNAPSHOT}}</p><p>{{SCOPE}}</p><p class="muted">有身份的阅读快照；任务、设计及验证仍以其原始来源为准。</p></header><nav aria-label="导览目录">{{NAV}}</nav>{{CONTENT}}</main>
<script type="application/json" id="engineering-data">{{DATA}}</script>
<script>
'use strict';
const model=JSON.parse(document.getElementById('engineering-data').textContent);
const basisNames={observed:'有依据',inferred:'推断',unknown:'待核实'};
for(const figure of document.querySelectorAll('[data-map]')){
  const graph=model.graphs[Number(figure.dataset.map)];
  const state={selected:null,direction:'all',query:'',notice:''};
  const detail=figure.querySelector('.node-detail'),search=figure.querySelector('[data-search]'),target=figure.querySelector('[data-route-target]');
  const nodeById=new Map(graph.nodes.map(node=>[node.id,node]));
  function element(tag,text){const item=document.createElement(tag);item.textContent=text;return item;}
  function reach(seed,mode){const seen=new Set([seed]),queue=[seed];while(queue.length){const current=queue.shift();for(const edge of graph.edges){const a=mode==='upstream'?edge.to:edge.from,b=mode==='upstream'?edge.from:edge.to;if(a===current&&!seen.has(b)){seen.add(b);queue.push(b);}}}return seen;}
  function route(seed,end){const queue=[{node:seed,nodes:[seed],edges:[]}],seen=new Set([seed]);while(queue.length){const item=queue.shift();if(item.node===end)return item;for(let i=0;i<graph.edges.length;i++){const edge=graph.edges[i];if(edge.from===item.node&&!seen.has(edge.to)){seen.add(edge.to);queue.push({node:edge.to,nodes:[...item.nodes,edge.to],edges:[...item.edges,i]});}}}return null;}
  function disclosure(label, value){
    const item=element('details','');
    item.append(element('summary',label),element('p',value));
    return item;
  }
  function detailText(label, value){
    return [...value].length>160?disclosure(label,value):element('p',value);
  }
  function renderDetail(){
    if(!state.selected){detail.replaceChildren(element('p','选择节点查看完整说明、关系及来源。'));return;}
    const node=nodeById.get(state.selected);
    const heading=displayName(node.id), basis=element('p',basisNames[node.basis||'observed']);
    basis.className='muted';
    detail.replaceChildren(element('h3',heading),basis);
    if(heading!==node.label)detail.append(disclosure('完整节点名称',node.label));
    if(node.summary&&node.summary!==node.label)detail.append(detailText('完整摘要',node.summary));
    if(node.description&&node.description!==node.label&&node.description!==node.summary){
      detail.append(detailText('完整说明',node.description));
    }
    const related=graph.edges.filter(edge=>edge.from===node.id||edge.to===node.id);
    if(related.length){
      detail.append(element('h4','关系'));
      const list=element('ul','');
      list.className='node-relations';
      for(const edge of related){
        const outgoing=edge.from===node.id, other=outgoing?edge.to:edge.from;
        const name=displayName(other), label=outgoing?'指向 '+name:'来自 '+name;
        const item=element('li',''), certainty=element('span',basisNames[edge.basis||'observed']);
        certainty.className='muted';
        item.append(element('strong',label),certainty,detailText('完整关系说明',edge.label));
        if(name!==nodeById.get(other).label)item.append(disclosure('完整节点名称',nodeById.get(other).label));
        list.append(item);
      }
      detail.append(list);
    }
    detail.append(element('h4','来源'));
    const refs=graph.sources[node.id];
    if(!refs.length){detail.append(element('p','未提供可定位来源；标记由源内容作者填写。'));return;}
    const identities=element('details','');identities.className='source-identity';identities.append(element('summary','来源与内容身份'));
    for(const ref of refs){const p=element('p',''),a=element('a',ref.path);a.href=ref.href;p.append(a);if(ref.line)p.append(element('span',' · 行 '+ref.line+'–'+ref.end_line));detail.append(p);identities.append(element('p',ref.path),element('code',ref.sha256));}
    identities.append(element('p','来源定位与内容身份已核对；关系含义和工程验收仍需相应依据。'));detail.append(identities);
  }
  function displayName(id){const label=nodeById.get(id).label;return [...label].length>32?[...label].slice(0,31).join('')+'…':label;}
  function paint(){
    const matches=graph.nodes.filter(node=>node.label.toLowerCase().includes(state.query)||String(node.description||'').toLowerCase().includes(state.query));
    const path=state.direction==='route'?route(state.selected,target.value):null;
    const hits=state.query?new Set(matches.map(node=>node.id)):state.direction==='route'?new Set(path?path.nodes:[state.selected]):state.selected&&state.direction!=='all'?reach(state.selected,state.direction):new Set(graph.nodes.map(node=>node.id));
    for(const item of figure.querySelectorAll('[data-node]')){item.classList.toggle('selected',item.dataset.node===state.selected);item.classList.toggle('dim',!hits.has(item.dataset.node));item.setAttribute('aria-pressed',String(item.dataset.node===state.selected));}
    for(const item of figure.querySelectorAll('[data-edge]')){const edge=graph.edges[Number(item.dataset.edge)];const active=state.direction==='route'?Boolean(path&&path.edges.includes(Number(item.dataset.edge))):hits.has(edge.from)&&hits.has(edge.to);item.classList.toggle('dim',!active);item.classList.toggle('reached',state.direction!=='all'&&active);}
    for(const label of figure.querySelectorAll('[data-for-edge]'))label.classList.toggle('dim',figure.querySelector('[data-edge="'+label.dataset.forEdge+'"]').classList.contains('dim'));
    for(const button of figure.querySelectorAll('[data-direction]'))button.setAttribute('aria-pressed',String(!state.query&&button.dataset.direction===state.direction));
    const current=state.selected?'当前节点：'+displayName(state.selected):'尚未选择节点';
    let message=state.query?(matches.length?'找到 '+matches.length+' 个节点。':'没有匹配节点；修改搜索词或点击全图恢复。'):state.direction==='route'?(path?'已列有向路径：'+path.nodes.map(displayName).join(' → '):'本图没有已列路径；不能据此判断真实系统没有关系。'):({all:'全图',upstream:'上游',downstream:'下游'}[state.direction]+' · '+current);
    figure.querySelector('.search-summary').textContent=state.notice||message;
    figure.querySelector('[data-show-detail]').disabled=!state.selected;figure.querySelector('[data-return-node]').disabled=!state.selected;
  }
  function clearSearch(){state.query='';search.value='';state.notice='';}
  function choose(id){clearSearch();if(state.direction==='route')state.direction='all';state.selected=id;renderDetail();paint();}
  figure.querySelector('[data-route]').addEventListener('click',()=>{state.notice='';if(!state.selected||!target.value){state.notice='先选择起点节点和路径终点。';paint();return;}clearSearch();state.direction='route';paint();});
  target.addEventListener('change',()=>{state.notice='';if(state.direction==='route')state.direction='all';paint();});
  for(const node of figure.querySelectorAll('[data-node]')){node.addEventListener('click',()=>choose(node.dataset.node));node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose(node.dataset.node);}});}
  for(const button of figure.querySelectorAll('[data-direction]'))button.addEventListener('click',()=>{
    const direction=button.dataset.direction;
    if(direction!=='all'&&!state.selected){state.notice='请先选择一个节点，再查看'+(direction==='upstream'?'上游':'下游')+'。';paint();return;}
    clearSearch();state.direction=direction;
    if(direction==='all'){state.selected=null;target.value='';renderDetail();}paint();
  });
  search.addEventListener('input',()=>{state.query=search.value.trim().toLowerCase();state.direction='all';state.notice='';const matches=graph.nodes.filter(node=>node.label.toLowerCase().includes(state.query)||String(node.description||'').toLowerCase().includes(state.query));state.selected=state.query&&matches.length===1?matches[0].id:null;renderDetail();paint();});
  figure.querySelector('[data-show-detail]').addEventListener('click',()=>{detail.focus({preventScroll:true});detail.scrollIntoView({block:'nearest'});});
  figure.querySelector('[data-return-node]').addEventListener('click',()=>{const node=Array.from(figure.querySelectorAll('[data-node]')).find(node=>node.dataset.node===state.selected);if(node){node.focus({preventScroll:true});node.scrollIntoView({block:'center'});}});
  paint();
}
for(const button of document.querySelectorAll('[data-target]'))button.addEventListener('click',()=>{for(const item of document.querySelectorAll('[data-target]'))item.setAttribute('aria-pressed',String(item===button));for(const panel of document.querySelectorAll('[data-panel]'))panel.hidden=panel.id!==button.dataset.target;});
for(const button of document.querySelectorAll('[data-target][aria-pressed=true]'))button.click();
</script></body></html>
