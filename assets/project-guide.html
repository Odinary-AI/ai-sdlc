<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--paper:#f7f8f4;--ink:#202c33;--muted:#52616a;--line:#cbd2cd;--accent:#145f58;--focus:#b25916}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.75 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1120px;margin:auto;padding:42px 28px 80px}header{border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:36px;line-height:1.3;margin:0 0 12px}h2{font-size:26px;line-height:1.4}h3{font-size:20px}h4{font-size:17px}p{max-width:82ch}a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}button,input,select{font:inherit}button{padding:6px 14px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:var(--accent);color:#fff}input,select{border:1px solid var(--line);border-radius:4px;padding:6px 10px;max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}nav{display:flex;gap:10px 18px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line)}section{padding:16px 0;scroll-margin-top:18px}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}pre{overflow:auto;background:#edf0e9;padding:16px}table{border-collapse:collapse;display:block;overflow:auto}th,td{padding:10px;border:1px solid var(--line);text-align:left}.snapshot,.muted,.source,.map-hint{color:var(--muted);font-size:15px}.note,.node-detail{background:#eef2ec;border-left:3px solid var(--accent);padding:12px 18px}.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}.buttons,.map-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panel[hidden]{display:none}.panel{margin-top:16px}.map{margin:24px 0 36px}.map figcaption{font-size:21px;font-weight:650}.map{border-top:1px solid var(--line);padding-top:18px}.map-controls{background:#edf1eb;padding:12px;border-radius:6px}.map-controls label{font-size:14px}.map-hint{font-size:14px}.map-scroll{background:#fbfcf9;border:1px solid #dce2d8;border-radius:10px;margin:10px 0;padding:12px}.map-scroll{overflow-x:auto;padding:12px 0}.map svg{display:block;width:100%;min-width:690px}.map-group rect{fill:#f0f3ed;stroke:#c8d2c5;stroke-width:1}.map-group text{font-size:13px;font-weight:600;fill:#52616a}.edge{fill:none;stroke:#577569;stroke-width:1.8}.edge.conditional,.edge.optional,.edge.feedback{stroke-dasharray:7 5;stroke:#859388}.edge.reference{stroke:#78909b;stroke-dasharray:2 4}.edge.uncertain{stroke-dasharray:3 5}.edge-label rect{fill:#fbfcf9;stroke:#dce2d8;stroke-width:.5}.edge-label text{font-size:12px;fill:#46574e}.node rect{fill:#fff;stroke:#aebeb1;stroke-width:1.25}.node.core rect{fill:#e3f0ea;stroke:#326f5f;stroke-width:1.8}.node.data rect{fill:#edf2f6;stroke:#829cae}.node.optional rect{stroke-dasharray:5 3;fill:#f9faf7}.node.actor rect,.node.result rect{fill:#f2f4ed}.node text{fill:var(--ink)}.node .node-role{font-size:12px;fill:#617065}.node .node-title{font-size:16px;font-weight:650}.node .node-summary{font-size:12px;fill:#52616a}.node .basis{font-size:11px;fill:#617065}.node{cursor:pointer}.node.selected rect,.node:focus-visible rect{stroke:var(--focus);stroke-width:3}.node:focus-visible{outline:none}.edge.reached{stroke:var(--accent);stroke-width:3}.dim{opacity:.24}.node-detail h3{margin:0 0 8px}.node-detail p{margin:6px 0}.node-detail ul{margin:6px 0}.node-detail code{font-size:13px;overflow-wrap:anywhere}.architecture-map{margin:22px 0;overflow-x:auto}.architecture-map svg{width:100%;min-width:650px}.architecture-map text{font:16px system-ui}.arch-node rect,.arch-mode rect{fill:#fff;stroke:var(--line)}.arch-heading,.arch-package-title{font-weight:650}.arch-small{font-size:13px!important}.arch-guidance{stroke-dasharray:6 5}.diagram-key{font-size:14px;color:var(--muted)}footer{margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:700px){main{padding:24px 16px 60px}.pairs{grid-template-columns:1fr}h1{font-size:30px}}@media print{button,input{display:none}main{padding:0;max-width:none}.dim{opacity:1}.node-detail{break-inside:avoid}a{color:inherit}}
</style></head>
<body><main><header><h1>{{TITLE}}</h1><p class="snapshot">{{SNAPSHOT}}</p><p>{{SCOPE}}</p><p class="muted">有身份的阅读快照；任务、设计及验证仍以其原始来源为准。</p></header><nav aria-label="导览目录">{{NAV}}</nav>{{CONTENT}}</main>
<script type="application/json" id="engineering-data">{{DATA}}</script>
<script>
'use strict';
const model=JSON.parse(document.getElementById('engineering-data').textContent);
const basisNames={observed:'有依据',inferred:'推断',unknown:'待核实'};
for(const figure of document.querySelectorAll('[data-map]')){
  const graph=model.graphs[Number(figure.dataset.map)];let selected=null,direction='all';
  const detail=figure.querySelector('.node-detail');
  function element(tag,text){const item=document.createElement(tag);item.textContent=text;return item;}
  function reach(seed,mode){const seen=new Set([seed]),queue=[seed];while(queue.length){const current=queue.shift();for(const edge of graph.edges){const a=mode==='upstream'?edge.to:edge.from,b=mode==='upstream'?edge.from:edge.to;if(a===current&&!seen.has(b)){seen.add(b);queue.push(b);}}}return seen;}
  function route(seed,target){const queue=[{node:seed,nodes:[seed],edges:[]}],seen=new Set([seed]);while(queue.length){const item=queue.shift();if(item.node===target)return item;for(let i=0;i<graph.edges.length;i++){const edge=graph.edges[i];if(edge.from===item.node&&!seen.has(edge.to)){seen.add(edge.to);queue.push({node:edge.to,nodes:[...item.nodes,edge.to],edges:[...item.edges,i]});}}}return null;}
  function paint(){
    const path=direction==='route'?route(selected,figure.querySelector('[data-route-target]').value):null;
    const hits=direction==='route'?new Set(path?path.nodes:[selected]):selected&&direction!=='all'?reach(selected,direction):new Set(graph.nodes.map(node=>node.id));
    for(const item of figure.querySelectorAll('[data-node]')){item.classList.toggle('selected',item.dataset.node===selected);item.classList.toggle('dim',!hits.has(item.dataset.node));item.setAttribute('aria-pressed',String(item.dataset.node===selected));}
    for(const item of figure.querySelectorAll('[data-edge]')){const edge=graph.edges[Number(item.dataset.edge)];const active=direction==='route'?Boolean(path&&path.edges.includes(Number(item.dataset.edge))):hits.has(edge.from)&&hits.has(edge.to);item.classList.toggle('dim',!active);item.classList.toggle('reached',direction!=='all'&&active);}
    for(const label of figure.querySelectorAll('[data-for-edge]'))label.classList.toggle('dim',figure.querySelector('[data-edge="'+label.dataset.forEdge+'"]').classList.contains('dim'));
    for(const button of figure.querySelectorAll('[data-direction]'))button.setAttribute('aria-pressed',String(button.dataset.direction===direction));
  }
  function choose(id){
    if(direction==='route')direction='all';selected=id;const node=graph.nodes.find(item=>item.id===id);detail.replaceChildren(element('h3',node.label),element('p',basisNames[node.basis||'observed']+' · '+(node.description||'没有补充说明')));
    if(node.summary)detail.append(element('p',node.summary));
    const edges=graph.edges.filter(edge=>edge.from===id||edge.to===id);const list=element('ul','');for(const edge of edges){const from=graph.nodes.find(item=>item.id===edge.from).label,to=graph.nodes.find(item=>item.id===edge.to).label;list.append(element('li',from+' → '+to+'：'+edge.label+'（'+basisNames[edge.basis||'observed']+'）'));}detail.append(list);
    const refs=graph.sources[id];if(!refs.length)detail.append(element('p','未提供可定位来源；标记由源内容作者填写。'));
    for(const ref of refs){const p=element('p','来源：'),a=element('a',ref.path);a.href=ref.href;p.append(a);if(ref.line)p.append(element('span',' · 行 '+ref.line+'–'+ref.end_line));detail.append(p);const hash=element('code','内容身份 '+ref.sha256);detail.append(hash);}
    detail.append(element('p','来源定位与内容身份已核对；关系含义和工程验收仍需相应依据。'));paint();
  }
  figure.querySelector('[data-route]').addEventListener('click',()=>{const target=figure.querySelector('[data-route-target]').value;if(!selected||!target){figure.querySelector('.search-summary').textContent='先选择起点节点和路径终点。';return;}const path=route(selected,target);direction='route';figure.querySelector('.search-summary').textContent=path?'已列有向路径：'+path.nodes.map(id=>graph.nodes.find(node=>node.id===id).label).join(' → '):'本图没有已列路径；不能据此判断真实系统没有关系。';paint();});
  for(const node of figure.querySelectorAll('[data-node]')){node.addEventListener('click',()=>choose(node.dataset.node));node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose(node.dataset.node);}});}
  for(const button of figure.querySelectorAll('[data-direction]'))button.addEventListener('click',()=>{if(!selected&&direction!=='all')return;direction=button.dataset.direction;if(!selected&&direction!=='all')choose(graph.nodes[0].id);paint();});
  figure.querySelector('[data-search]').addEventListener('input',event=>{const value=event.target.value.trim().toLowerCase(),matches=graph.nodes.filter(node=>node.label.toLowerCase().includes(value)||String(node.description||'').toLowerCase().includes(value));figure.querySelector('.search-summary').textContent=!value?'未筛选节点。':matches.length?'找到 '+matches.length+' 个节点。':'没有匹配节点。';if(value&&matches.length===1)choose(matches[0].id);else{direction='all';paint();for(const node of figure.querySelectorAll('[data-node]'))node.classList.toggle('dim',Boolean(value)&&!matches.some(item=>item.id===node.dataset.node));}});
  paint();
}
for(const button of document.querySelectorAll('[data-target]'))button.addEventListener('click',()=>{for(const item of document.querySelectorAll('[data-target]'))item.setAttribute('aria-pressed',String(item===button));for(const panel of document.querySelectorAll('[data-panel]'))panel.hidden=panel.id!==button.dataset.target;});
for(const button of document.querySelectorAll('[data-target][aria-pressed=true]'))button.click();
</script></body></html>
